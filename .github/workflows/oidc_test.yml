name: OIDC Login Test

on:
  workflow_dispatch:

# MUST include id-token permission
permissions:
  id-token: write
  contents: read

jobs:
  oidc-login:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_OIDC_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Show account
        run: az account show

          APP=${{ secrets.AZURE_OIDC_CLIENT_ID }}
          SP_OBJ=$(az ad sp show --id $APP --query objectId -o tsv)
          az role assignment list --assignee-object-id $SP_OBJ -o table || true
